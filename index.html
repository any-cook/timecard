<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2563eb">
  <title>⏰ タイムカード | 打刻</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .number-input-section{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 20px;text-align:center;margin-bottom:16px;}
    .number-input-section h2{font-size:1rem;font-weight:700;color:var(--text-muted);margin-bottom:16px;}
    .number-display{font-size:2.8rem;font-weight:900;letter-spacing:0.25em;color:var(--text);background:var(--surface2);border-radius:12px;padding:14px 20px;margin-bottom:16px;min-height:72px;display:flex;align-items:center;justify-content:center;}
    .number-display.placeholder{color:var(--text-muted);font-size:1.1rem;font-weight:400;letter-spacing:0;}
    .numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto 14px;}
    .numpad-btn{background:var(--surface2);border:2px solid var(--border);border-radius:12px;font-size:1.6rem;font-weight:700;color:var(--text);padding:16px 0;cursor:pointer;transition:all 0.12s;font-family:'Noto Sans JP',sans-serif;-webkit-tap-highlight-color:transparent;}
    .numpad-btn:active{transform:scale(0.94);background:var(--accent);color:#fff;border-color:var(--accent);}
    .numpad-btn.btn-delete{font-size:1.2rem;color:var(--text-muted);}
    .numpad-btn.btn-confirm{grid-column:1/-1;background:var(--accent);color:#fff;border-color:var(--accent);font-size:1.1rem;padding:18px;}
    .numpad-btn.btn-confirm:active{background:#1d4ed8;}
    .numpad-btn.btn-confirm:disabled{background:var(--border);color:var(--text-muted);border-color:var(--border);cursor:not-allowed;transform:none;}
    .confirm-section{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 20px;text-align:center;margin-bottom:16px;}
    .confirm-name{font-size:1.6rem;font-weight:900;color:var(--text);margin-bottom:6px;}
    .confirm-number{font-size:0.85rem;color:var(--text-muted);margin-bottom:20px;}
    .confirm-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .btn-yes{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:1rem;font-weight:700;padding:14px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
    .btn-no{background:var(--surface2);color:var(--text);border:2px solid var(--border);border-radius:var(--radius-sm);font-size:1rem;font-weight:700;padding:14px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
  </style>
</head>
<body>
  <header class="clock-header">
    <h1>⏰ タイムカード打刻</h1>
    <a href="admin.html" class="admin-link">⚙️ 管理画面</a>
  </header>
  <main class="clock-main">
    <div class="demo-banner" id="demoBanner" style="display:none;width:100%;">🔧 デモモード動作中</div>
    <div class="digital-clock">
      <div id="clockDisplay">00:00:00</div>
      <div id="dateDisplay"></div>
    </div>

    <!-- 登録番号入力 -->
    <div class="number-input-section" id="staffSelectSection">
      <h2>登録番号を入力してください</h2>
      <div class="number-display placeholder" id="numberDisplay">登録番号を入力</div>
      <div class="numpad">
        <button class="numpad-btn" onclick="numPress('1')">1</button>
        <button class="numpad-btn" onclick="numPress('2')">2</button>
        <button class="numpad-btn" onclick="numPress('3')">3</button>
        <button class="numpad-btn" onclick="numPress('4')">4</button>
        <button class="numpad-btn" onclick="numPress('5')">5</button>
        <button class="numpad-btn" onclick="numPress('6')">6</button>
        <button class="numpad-btn" onclick="numPress('7')">7</button>
        <button class="numpad-btn" onclick="numPress('8')">8</button>
        <button class="numpad-btn" onclick="numPress('9')">9</button>
        <button class="numpad-btn btn-delete" onclick="numDelete()">⌫</button>
        <button class="numpad-btn" onclick="numPress('0')">0</button>
        <button class="numpad-btn" onclick="numClear()">C</button>
        <button class="numpad-btn btn-confirm" id="btnConfirm" onclick="confirmNumber()" disabled>✔ 確認</button>
      </div>
      <div id="numberError" style="color:var(--danger);font-weight:700;min-height:24px;"></div>
    </div>

    <!-- 名前確認 -->
    <div class="confirm-section" id="confirmSection" style="display:none;">
      <p style="font-size:.85rem;color:var(--text-muted);margin-bottom:8px;">この方ですか？</p>
      <div class="confirm-name" id="confirmName"></div>
      <div class="confirm-number" id="confirmNumberLabel"></div>
      <div class="confirm-buttons">
        <button class="btn-no" onclick="backToNumberInput()">← 違う</button>
        <button class="btn-yes" onclick="goToClockAction()">✔ はい</button>
      </div>
    </div>

    <!-- 打刻 -->
    <div id="clockActionSection" style="display:none;">
      <div class="card" style="text-align:center;">
        <p style="font-size:.8rem;color:var(--text-muted);margin-bottom:6px;">選択中のスタッフ</p>
        <div class="selected-staff-name" id="selectedStaffName"></div>
        <p id="selectedStaffNumber" style="font-size:.8rem;color:var(--text-muted);margin-top:4px;"></p>
      </div>
      <div class="card">
        <h2>現在の状況</h2>
        <div class="status-area" id="clockStatus"><span class="status-badge status-out">未出勤</span></div>
      </div>
      <div class="card">
        <h2>打刻</h2>
        <div class="clock-buttons">
          <button class="clock-btn btn-in" id="btnClockIn" onclick="clockIn()"><span class="btn-icon">🟢</span>出 勤</button>
          <button class="clock-btn btn-out" id="btnClockOut" onclick="clockOut()" disabled><span class="btn-icon">🔴</span>退 勤</button>
        </div>
      </div>
      <button class="btn-back" onclick="backToNumberInput()">← 登録番号入力に戻る</button>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script src="holidays.js"></script>
  <script src="demo-data.js"></script>
  <script src="clock.js"></script>
  <script>
    if (DEMO_MODE) { document.getElementById('demoBanner').style.display='block'; initDemoData(); }
    initClock().catch(function(err){ console.error(err); });
  </script>
</body>
</html>
